<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的待办清单</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">我的待办清单</h1>
      <p class="app__date" id="today"></p>
    </header>

    <!-- 输入区：回车或点“添加”都能新增一条待办 -->
    <form class="composer" id="composer">
      <input
        class="composer__input"
        id="input"
        type="text"
        placeholder="今天要做什么？写完按回车"
        autocomplete="off"
        maxlength="120"
      />
      <button class="composer__btn" type="submit">添加</button>
    </form>

    <!-- 筛选区：全部 / 未完成 / 已完成 -->
    <nav class="filters" id="filters">
      <button class="filters__btn is-active" data-filter="all" type="button">全部</button>
      <button class="filters__btn" data-filter="active" type="button">未完成</button>
      <button class="filters__btn" data-filter="done" type="button">已完成</button>
    </nav>

    <!-- 列表区：JS 会把 <li> 渲染到这里 -->
    <ul class="list" id="list"></ul>

    <!-- 空状态：一条待办都没有时显示 -->
    <p class="empty" id="empty">还没有待办，先写下第一件小事吧。</p>

    <footer class="app__footer">
      <span id="counter">共 0 条 · 未完成 0 条</span>
      <button class="linkbtn" id="clearDone" type="button">清除已完成</button>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
